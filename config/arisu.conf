# 1. Định danh bàn phím (Sửa lỗi hiển thị "nice_dongle")
CONFIG_ZMK_KEYBOARD_NAME="Arisu"

# 2. Bluetooth & Kết nối
CONFIG_ZMK_BLE=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 3. Quản lý năng lượng (Deep Sleep sau 15 phút)
CONFIG_ZMK_SLEEP=y
# 900.000 ms = 15 phút. (300.000 của bạn mới là 5 phút)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# 4. Tắt các tính năng gây lỗi biên dịch (Studio/OLED nếu không dùng)
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_DISPLAY=n

# 5. Tối ưu phản hồi phím (Debounce)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5